services:
  db:
    image: postgres:16-alpine
    container_name: ichatlar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ichatlar
      POSTGRES_PASSWORD: ichatlar
      POSTGRES_DB: ichatlar
      # Türkçe sıralama ve büyük/küçük harf davranışı için
      LANG: tr_TR.utf8
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ichatlar -d ichatlar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
